# VisionGuard stack (Task 6.3):  docker compose up -d --build
# Requires an untracked .env (copy .env.example). Only the web port is published.
name: 24l-0672_a2_ops

services:
  web:
    build: .
    image: 24l-0672_a2_ops-web:latest
    env_file: .env
    environment:
      # services reach each other by NAME on the compose network: host "db", not localhost
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MODEL_PATH: /app/models/champion.keras
      INFERENCE_BACKEND: ${INFERENCE_BACKEND:-local}
    volumes:
      # model mounted read-only: swap models without rebuilding the 1 GB image
      - ./models:/app/models:ro
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy   # wait until Postgres accepts connections
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data   # named volume: history survives `compose down`
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # NO "ports:" -> 5432 is reachable only from the web container, not from outside
    restart: unless-stopped

volumes:
  pgdata:
